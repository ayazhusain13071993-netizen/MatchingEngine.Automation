name: UI tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run tests (headless Chrome)
        run: dotnet test --logger "trx;LogFileName=results.trx" --results-directory TestResults
        env:
          HEADLESS: "true"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults/
            MatchingEngine.Automation/bin/**/screenshots/
